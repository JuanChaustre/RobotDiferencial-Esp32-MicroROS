[platformio]
default_envs = blink

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:blink]
build_src_filter = +<blink/main.cpp>

[env:microros_wifi]
board_microros_distro = humble
board_microros_transport = wifi
build_src_filter = +<microros_wifi/main.cpp>
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
